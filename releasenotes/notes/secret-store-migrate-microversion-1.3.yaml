---
features:
  - |
    Added support for Barbican microversion 1.3, including
    ``SecretManager.migrate_store`` and the OSC command
    ``openstack secret migrate`` to move a secret onto another
    configured secret store via
    ``PUT /v1/secrets/{id}/secret-store/{secret-store-id}``.
    Secret GET/list also expose computed ``secret_store_id`` and
    ``secret_store_ref`` (may be null).
